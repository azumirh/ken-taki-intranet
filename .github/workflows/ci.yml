name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/production-hardening

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx eslint . --format json --output-file eslint-report.json

      - name: Upload lint report
        if: always() && hashFiles('eslint-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 3

      - name: Build
        run: bun run build
