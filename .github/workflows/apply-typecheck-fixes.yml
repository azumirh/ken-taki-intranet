name: Apply typecheck fixes

on:
  push:
    branches:
      - fix/lovable-typecheck
    paths:
      - scripts/apply-typecheck-fixes.mjs
      - .github/workflows/apply-typecheck-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lovable-typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply surgical fixes
        run: node scripts/apply-typecheck-fixes.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: resolve strict TypeScript errors"
          git push origin HEAD:fix/lovable-typecheck
